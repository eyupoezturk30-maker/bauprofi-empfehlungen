name: One-time fix BauProfi static SEO and tracking

on:
  push:
    paths:
      - '.github/workflows/fix-bauprofi-static-seo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch static homepage and source attribution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          old_title = '<title>BauProfi Empfehlungen 2026 | 100 Kaufoptionen</title>'
          new_title = '<title>BauProfi Empfehlungen 2026 | Werkzeug, Baustelle & Kaufhilfe</title>'
          old_desc = '<meta name="description" content="100 BauProfi Kaufoptionen mit 15 direkten Produktempfehlungen und 85 aktuellen Amazon-Suchen für Baustelle, Werkzeug, Messtechnik, Werkstatt, Auto, Garten und Arbeitsschutz.">'
          new_desc = '<meta name="description" content="BauProfi Kaufhilfe 2026 für Werkzeug, Messtechnik, Baustelle und Auto: 5 Schnell-Empfehlungen, 15 Direktprodukte, 85 Kauf-Suchen und praktische Ratgeber.">'
          if old_title not in html or old_desc not in html:
              raise SystemExit('Expected title/meta markers not found')
          html = html.replace(old_title, new_title, 1).replace(old_desc, new_desc, 1)

          old_nav = '<nav class="topnav"><a href="#schnellstart">Schnellstart</a><a href="#produkte">Produkte</a><a href="#katalog">85 Suchen</a><a href="ratgeber/index.html">Ratgeber</a><a href="teilen.html">Teilen</a></nav>'
          new_nav = '<nav class="topnav"><a href="#top5">Top 5</a><a href="#schnellstart">Schnellstart</a><a href="#produkte">Produkte</a><a href="#katalog">85 Suchen</a><a href="ratgeber/index.html">Ratgeber</a><a href="teilen.html">Teilen</a></nav>'
          if old_nav not in html:
              raise SystemExit('Expected nav marker not found')
          html = html.replace(old_nav, new_nav, 1)

          old_primary = '<a class="primary" href="#schnellstart">Zu den schnellen Kauf-Tipps ↓</a>'
          new_primary = '<a class="primary" href="#top5">Zu den 5 Schnell-Empfehlungen ↓</a>'
          if old_primary not in html:
              raise SystemExit('Expected primary CTA marker not found')
          html = html.replace(old_primary, new_primary, 1)

          marker = '<section class="sec" id="schnellstart">'
          if marker not in html:
              raise SystemExit('Expected quickstart marker not found')
          if 'id="top5"' not in html:
              top5 = '''<section class="sec" id="top5"><div class="head"><h2>5 Schnell-Empfehlungen für Baustelle, Montage & Auto</h2><p>Die wichtigsten Kaufwege direkt im HTML: klarer Einsatzzweck, Prüfpunkte vor dem Kauf und transparente Amazon-Partnerlinks.</p></div><div class="grid">
<article class="card"><div class="n">Top 1 · Montage</div><h3>KNIPEX Cobra 250</h3><p>Vielseitige Wasserpumpenzange für Montage, Sanitär und Werkstatt.</p><div class="fit"><b>Passt gut, wenn …</b>du eine robuste Allround-Zange für häufige Greif- und Montagearbeiten suchst.</div><div class="check">Vor Kauf prüfen: Ist die 250-mm-Grösse für deinen Einsatz passend?</div><a class="cta affiliate" data-product="top5_knipex" href="https://www.amazon.de/dp/B0001D9JAI/ref=nosim?tag=bauprofitipps-21" target="_blank" rel="nofollow sponsored noopener">KNIPEX bei Amazon ansehen →</a><small>Anzeige / Affiliate-Link.</small></article>
<article class="card"><div class="n">Top 2 · Aufmass</div><h3>Bosch Professional GLM 40-31</h3><p>Laser-Entfernungsmesser für schnelle Distanzmessungen auf der Baustelle.</p><div class="fit"><b>Passt gut, wenn …</b>du regelmässig Längen und Kontrollmasse erfassen musst.</div><div class="check">Vor Kauf prüfen: Messfunktionen und Lieferumfang.</div><a class="cta affiliate" data-product="top5_bosch_glm" href="https://www.amazon.de/dp/B0FTLZX22W/ref=nosim?tag=bauprofitipps-21" target="_blank" rel="nofollow sponsored noopener">GLM 40-31 bei Amazon ansehen →</a><small>Anzeige / Affiliate-Link. <a href="ratgeber/laser-entfernungsmesser-baustelle.html">Kaufhilfe lesen</a></small></article>
<article class="card"><div class="n">Top 3 · Akku-Werkzeug</div><h3>Bosch GBH 18V-22</h3><p>18-V-SDS-plus-Bohrhammer für mobile Montage- und Bohrarbeiten.</p><div class="fit"><b>Passt gut, wenn …</b>kabelloses Arbeiten und geringes Gewicht wichtig sind.</div><div class="check">Vor Kauf prüfen: Sind Akku und Ladegerät enthalten?</div><a class="cta affiliate" data-product="top5_bosch_gbh18v22" href="https://www.amazon.de/dp/B0CGX9L9CL/ref=nosim?tag=bauprofitipps-21" target="_blank" rel="nofollow sponsored noopener">GBH 18V-22 bei Amazon ansehen →</a><small>Anzeige / Affiliate-Link. <a href="ratgeber/akku-bohrhammer-kaufen.html">Kaufhilfe lesen</a></small></article>
<article class="card"><div class="n">Top 4 · Pannenhilfe</div><h3>NOCO Boost GB40</h3><p>Kompakter 12-V-Starthilfe-Booster fürs Fahrzeug.</p><div class="fit"><b>Passt gut, wenn …</b>du Starthilfe griffbereit im Fahrzeug haben möchtest.</div><div class="check">Vor Kauf prüfen: Motor-, Batterie- und Fahrzeugeignung.</div><a class="cta affiliate" data-product="top5_noco_gb40" href="https://www.amazon.de/dp/B015TKUPIC/ref=nosim?tag=bauprofitipps-21" target="_blank" rel="nofollow sponsored noopener">NOCO GB40 bei Amazon ansehen →</a><small>Anzeige / Affiliate-Link. <a href="ratgeber/starthilfe-powerbank-auto.html">Kaufhilfe lesen</a></small></article>
<article class="card"><div class="n">Top 5 · Reifenpflege</div><h3>Bosch EasyPump</h3><p>Akku-Luftpumpe für Reifen und unterwegs.</p><div class="fit"><b>Passt gut, wenn …</b>du Reifendruck ohne grossen Kompressor nachfüllen möchtest.</div><div class="check">Vor Kauf prüfen: Druckbereich und Ventiladapter.</div><a class="cta affiliate" data-product="top5_bosch_easypump" href="https://www.amazon.de/dp/B08HQHW4LS/ref=nosim?tag=bauprofitipps-21" target="_blank" rel="nofollow sponsored noopener">EasyPump bei Amazon ansehen →</a><small>Anzeige / Affiliate-Link. <a href="ratgeber/reifenkompressor-auto.html">Kaufhilfe lesen</a></small></article>
</div><div class="method"><strong>Praxisblick:</strong> Die Auswahl ordnet Produkte nach Einsatzzweck, Kompatibilität und typischen Kaufkriterien. Eigene Labor- oder Vergleichstests werden nicht behauptet. Als Amazon-Partner verdiene ich an qualifizierten Verkäufen.</div></section>\n'''
              html = html.replace(marker, top5 + marker, 1)
          index.write_text(html, encoding='utf-8')

          analytics = Path('analytics.js')
          js = analytics.read_text(encoding='utf-8')
          old_source = "else if (ref.includes('eyupoezturk30-maker.github.io/bauprofi-empfehlungen')) source = 'seo';"
          new_source = "else if (ref.includes(location.host)) source = 'direct';"
          if old_source not in js:
              raise SystemExit('Expected source attribution marker not found')
          js = js.replace(old_source, new_source, 1)

          start = js.find("      const top5 = document.createElement('section');")
          end = js.find("      const applyCountry = (next) => {", start)
          if start == -1 or end == -1:
              raise SystemExit('Expected dynamic Top5 block not found')
          js = js[:start] + "      // Top-5 content is now static in index.html so crawlers and users see it immediately.\n      const top5 = document.getElementById('top5');\n\n" + js[end:]
          analytics.write_text(js, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          old = '<url><loc>https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/</loc><lastmod>2026-08-18</lastmod></url>'
          new = '<url><loc>https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/</loc><lastmod>2026-08-21</lastmod></url>'
          if old in sm:
              sm = sm.replace(old, new, 1)
          sitemap.write_text(sm, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html analytics.js sitemap.xml
          git diff --cached --check
          git commit -m 'Make BauProfi Top 5 static and fix source tracking'
          git push origin HEAD:main

# manual trigger 2026-08-21
