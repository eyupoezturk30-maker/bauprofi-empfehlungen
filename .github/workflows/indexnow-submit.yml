name: Submit BauProfi to IndexNow

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'katalog/**'
      - 'ratgeber/**'
      - 'sitemap.xml'
      - 'f3c9d7a86b1542e4a7c3f9b5d1e8a642.txt'
      - '.github/workflows/indexnow-submit.yml'
  schedule:
    - cron: '17 5 * * *'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs when IndexNow key is live
        shell: bash
        run: |
          set -u
          SITE='https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen'
          KEY='f3c9d7a86b1542e4a7c3f9b5d1e8a642'
          READY=0
          for attempt in $(seq 1 36); do
            if curl -fsSL --connect-timeout 10 --max-time 20 "${SITE}/${KEY}.txt" 2>/dev/null | grep -qx "$KEY"; then READY=1; break; fi
            echo "Key not live yet (${attempt}/36); waiting 10s..."
            sleep 10
          done
          if [ "$READY" != "1" ]; then
            echo "::warning::IndexNow key is not live yet. Skipping without failure; daily retry will try again."
            exit 0
          fi
          cat > payload.json <<'JSON'
          {"host":"eyupoezturk30-maker.github.io","key":"f3c9d7a86b1542e4a7c3f9b5d1e8a642","keyLocation":"https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/f3c9d7a86b1542e4a7c3f9b5d1e8a642.txt","urlList":["https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/bohren-meisseln.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/saegen-holzbau.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/messtechnik-baustelle.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/werkstatt-reinigung.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/auto-batterie-pannenhilfe.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/reifen-pflege.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/garten-maschinen.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/baustellen-strom.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/sicherheit-arbeitsschutz.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/katalog/werkzeug-handwerk.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/ratgeber/powerbank-baustelle.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/ratgeber/wasserpumpenzange-montage.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/ratgeber/laser-entfernungsmesser-baustelle.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/ratgeber/reifenkompressor-auto.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/ratgeber/starthilfe-powerbank-auto.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/ratgeber/mobile-klimaanlage-sommer.html","https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/ratgeber/turmventilator-sommer.html"]}
          JSON
          code=$(curl -sS -o response.txt -w '%{http_code}' --connect-timeout 15 --max-time 45 --retry 5 --retry-all-errors --retry-delay 3 -H 'Content-Type: application/json; charset=utf-8' -d @payload.json https://api.indexnow.org/indexnow || true)
          if [ "$code" = "200" ] || [ "$code" = "202" ]; then
            echo "IndexNow accepted BauProfi URLs with HTTP $code"
          else
            echo "::warning::IndexNow returned HTTP ${code:-unknown}; not marking workflow failed. Daily retry will try again."
            cat response.txt 2>/dev/null || true
          fi
