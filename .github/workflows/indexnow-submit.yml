name: Submit BauProfi to IndexNow

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'teilen.html'
      - 'katalog/**'
      - 'ratgeber/**'
      - 'sitemap.xml'
      - 'f3c9d7a86b1542e4a7c3f9b5d1e8a642.txt'
      - '.github/workflows/indexnow-submit.yml'
  schedule:
    - cron: '17 5 * * *'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit all sitemap URLs when IndexNow key is live
        shell: bash
        run: |
          set -u
          SITE='https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen'
          KEY='f3c9d7a86b1542e4a7c3f9b5d1e8a642'
          READY=0
          for attempt in $(seq 1 36); do
            if curl -fsSL --connect-timeout 10 --max-time 20 "${SITE}/${KEY}.txt" 2>/dev/null | grep -qx "$KEY"; then READY=1; break; fi
            echo "Key not live yet (${attempt}/36); waiting 10s..."
            sleep 10
          done
          if [ "$READY" != "1" ]; then
            echo "::warning::IndexNow key is not live yet. Skipping without failure; daily retry will try again."
            exit 0
          fi
          if ! curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 45 "${SITE}/sitemap.xml" -o sitemap.xml; then
            echo "::warning::Sitemap not reachable yet. Skipping without failure; daily retry will try again."
            exit 0
          fi
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          root=ET.parse('sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text.strip() for x in root.findall('s:url/s:loc',ns) if x.text and x.text.strip()]
          payload={
            'host':'eyupoezturk30-maker.github.io',
            'key':'f3c9d7a86b1542e4a7c3f9b5d1e8a642',
            'keyLocation':'https://eyupoezturk30-maker.github.io/bauprofi-empfehlungen/f3c9d7a86b1542e4a7c3f9b5d1e8a642.txt',
            'urlList':urls
          }
          with open('payload.json','w',encoding='utf-8') as f: json.dump(payload,f,ensure_ascii=False)
          print(f'Prepared {len(urls)} BauProfi URLs from sitemap.xml')
          PY
          code=$(curl -sS -o response.txt -w '%{http_code}' --connect-timeout 15 --max-time 45 --retry 5 --retry-all-errors --retry-delay 3 -H 'Content-Type: application/json; charset=utf-8' -d @payload.json https://api.indexnow.org/indexnow || true)
          if [ "$code" = "200" ] || [ "$code" = "202" ]; then
            echo "IndexNow accepted all sitemap URLs with HTTP $code"
          else
            echo "::warning::IndexNow returned HTTP ${code:-unknown}; not marking workflow failed. Daily retry will try again."
            cat response.txt 2>/dev/null || true
          fi
