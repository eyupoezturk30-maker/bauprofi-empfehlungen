<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061f32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eyüp Portfolio">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Eyüp Öztürk · Portfolio App</title>
<style>
:root{--navy:#061f32;--navy2:#0b4167;--lime:#c5eb37;--muted:#b7c5cf}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}button{font:inherit}.app{position:fixed;inset:0;background:#061f32;overflow:hidden}.bg{position:absolute;inset:-45px;background-size:cover;background-position:center;filter:blur(32px) brightness(.28);transform:scale(1.1);opacity:.9;transition:.25s}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top)) 6px max(78px,calc(env(safe-area-inset-bottom) + 72px))}.slide{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 18px 60px rgba(0,0,0,.45);user-select:none;-webkit-user-drag:none;background:#fff}.top{position:absolute;top:max(10px,calc(env(safe-area-inset-top) + 4px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;transition:.2s}.pill{background:rgba(3,20,33,.72);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;padding:9px 12px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.brand{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand b{color:var(--lime)}.controls{position:absolute;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));transform:translateX(-50%);display:flex;align-items:center;gap:9px;transition:.2s}.btn{width:48px;height:48px;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:rgba(3,20,33,.78);color:#fff;display:grid;place-items:center;font-size:23px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 26px rgba(0,0,0,.28)}.btn.main{background:var(--lime);color:#082f4d;border-color:transparent;font-weight:900}.menu{position:absolute;inset:0;display:none;align-items:flex-end;background:rgba(1,10,18,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:5}.menu.open{display:flex}.sheet{width:100%;max-height:78vh;overflow:auto;background:#082f4d;border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 70px rgba(0,0,0,.45)}.sheet h2{margin:2px 5px 14px;font-size:19px}.grid{display:grid;gap:8px}.item{border:1px solid rgba(255,255,255,.1);background:#0b4167;color:#fff;border-radius:15px;padding:13px 14px;text-align:left;font-weight:650}.item.active{outline:2px solid var(--lime);background:#0d4c77}.item small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:rgba(3,20,33,.9);border:1px solid rgba(255,255,255,.12);border-radius:17px;padding:13px 16px;font-size:13px;text-align:center;max-width:82%;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}.install{position:absolute;right:12px;bottom:max(74px,calc(env(safe-area-inset-bottom) + 68px));z-index:4;background:rgba(3,20,33,.9);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:10px 12px;font-size:12px;max-width:230px;display:none}.install.show{display:block}.install b{color:var(--lime)}.hidden{opacity:0;pointer-events:none!important}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#061f32;z-index:10;font-weight:700}.loading b{color:var(--lime)}@media (orientation:landscape){.stage{padding:max(6px,env(safe-area-inset-top)) 70px max(6px,env(safe-area-inset-bottom))}.slide{max-height:100vh;max-width:100vw}.controls{left:auto;right:max(10px,env(safe-area-inset-right));bottom:50%;transform:translateY(50%);flex-direction:column}}@media (min-width:900px){.slide{border-radius:8px;max-width:calc(100vw - 90px);max-height:calc(100vh - 42px)}}
</style>
</head>
<body>
<div class="app"><div class="bg" id="bg"></div><div class="stage"><img class="slide" id="slide" alt="Portfolio"></div><div class="top" id="top"><div class="pill brand">EYÜP ÖZTÜRK · <b>PORTFOLIO APP</b></div><div class="pill" id="counter">1 / 12</div></div><div class="controls" id="controls"><button class="btn" id="prev" aria-label="Zurück">‹</button><button class="btn main" id="menuBtn" aria-label="Menü">☰</button><button class="btn" id="next" aria-label="Weiter">›</button></div><div class="menu" id="menu"><div class="sheet"><h2>Inhalt</h2><div class="grid" id="grid"></div></div></div><div class="toast" id="toast">Wischen: nächste Seite · Handy drehen: grössere Ansicht</div><div class="install" id="install"><b>Als App speichern</b><br>Safari → Teilen → „Zum Home‑Bildschirm“</div><div class="loading" id="loading">Portfolio wird geladen&nbsp;<b>…</b></div></div>
<script>
const titles=['Start','Executive Profile','Karriere Journey','Project Manager · CBRE GWS GmbH','Technik · Führung · Projekte','Kernkompetenzen','Technische Basis','Führung & Zusammenarbeit','Qualifikationen & Tools','Geeignete Zielpositionen','Warum ich Mehrwert bringe','Technik. Führung. Projekte.'];
const paths=Array.from({length:12},(_,n)=>`slides/${String(n+1).padStart(2,'0')}.txt`),cache=new Map();let i=0,sx=0,sy=0,visible=true;
const elSlide=document.getElementById('slide'),bg=document.getElementById('bg'),counter=document.getElementById('counter'),menu=document.getElementById('menu'),grid=document.getElementById('grid'),topbar=document.getElementById('top'),controls=document.getElementById('controls'),toast=document.getElementById('toast'),install=document.getElementById('install'),loading=document.getElementById('loading');
async function getSlide(n){if(cache.has(n))return cache.get(n);const b64=(await (await fetch(paths[n])).text()).trim();const src='data:image/webp;base64,'+b64;cache.set(n,src);return src}
async function render(){const n=i,src=await getSlide(n);if(n!==i)return;elSlide.src=src;elSlide.alt=titles[i];bg.style.backgroundImage=`url('${src}')`;counter.textContent=`${i+1} / ${titles.length}`;document.title=`${titles[i]} · Eyüp Öztürk`;[...grid.children].forEach((x,k)=>x.classList.toggle('active',k===i));loading.style.display='none';getSlide((i+1)%12);getSlide((i+11)%12)}
function go(n){i=(n+12)%12;render()}
titles.forEach((t,n)=>{const b=document.createElement('button');b.className='item';b.innerHTML=`${n+1}. ${t}<small>Portfolio-Seite ${n+1}</small>`;b.onclick=()=>{i=n;render();menu.classList.remove('open')};grid.appendChild(b)});prev.onclick=()=>go(i-1);next.onclick=()=>go(i+1);menuBtn.onclick=()=>menu.classList.add('open');menu.onclick=e=>{if(e.target===menu)menu.classList.remove('open')};document.addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX;sy=e.changedTouches[0].screenY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-sx,dy=e.changedTouches[0].screenY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))dx<0?go(i+1):go(i-1)},{passive:true});elSlide.onclick=()=>{visible=!visible;topbar.classList.toggle('hidden',!visible);controls.classList.toggle('hidden',!visible)};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(i-1);if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='Escape')menu.classList.remove('open')});render();setTimeout(()=>{toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)},500);if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone){setTimeout(()=>install.classList.add('show'),3000);setTimeout(()=>install.classList.remove('show'),11000)}if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body></html>
